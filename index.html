<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="NEXO 2.0: ventas, fiados, inventario y caja para pequeños negocios." />
  <title>NEXO 2.0</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="businessNameMini">NEXO NEGOCIO</p>
        <h1 id="pageTitle">Inicio</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="installBtn" title="Instalar" hidden>＋</button>
        <button class="icon-btn" id="themeBtn" title="Cambiar tema">◐</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <button id="fab" class="fab" aria-label="Nueva acción">＋</button>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Inicio</small></button>
      <button data-route="debts" class="nav-item"><span>₵</span><small>Fiados</small></button>
      <button data-route="sales" class="nav-item"><span>▣</span><small>Ventas</small></button>
      <button data-route="products" class="nav-item"><span>□</span><small>Productos</small></button>
      <button data-route="more" class="nav-item"><span>•••</span><small>Más</small></button>
    </nav>
  </div>

  <dialog id="actionSheet" class="sheet">
    <form method="dialog" class="sheet-card">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><h2>Nueva acción</h2><button value="cancel" class="close-btn">×</button></div>
      <div class="action-grid">
        <button type="button" data-action="new-sale"><span>🛒</span>Nueva venta</button>
        <button type="button" data-action="new-debt"><span>💰</span>Nuevo fiado</button>
        <button type="button" data-action="new-payment"><span>💵</span>Registrar pago</button>
        <button type="button" data-action="new-product"><span>📦</span>Nuevo producto</button>
        <button type="button" data-action="new-expense"><span>🧾</span>Registrar gasto</button>
        <button type="button" data-action="close-day"><span>🔒</span>Cerrar caja</button>
      </div>
    </form>
  </dialog>

  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="app.js" defer></script>
</body>
</html>
